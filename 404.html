<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>페이지를 찾을 수 없습니다 | 주식회사 상효</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0A192F; color: #E2E8F0;
           font-family: Inter, "Noto Sans KR", system-ui, sans-serif; text-align: center; word-break: keep-all; }
    .code { font-size: clamp(72px, 18vw, 140px); font-weight: 900; letter-spacing: -0.04em; line-height: 1;
            background: linear-gradient(100deg, #B8952A, #F3DE8A 40%, #D4AF37 60%, #B8952A); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 20px 0 8px; font-size: 22px; color: #fff; }
    p { margin: 0; color: #94A3B8; }
    a { display: inline-block; margin-top: 32px; padding: 14px 28px; border-radius: 999px; background: #D4AF37; color: #0A192F; font-weight: 700; text-decoration: none; }
    a:hover { background: #DDBE52; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a id="home" href="/">홈으로 가기</a>
  </main>
  <script>
    // github.io/저장소/ 형태의 주소에서도 홈으로 정확히 이동하도록 보정
    if (location.hostname.endsWith('.github.io')) {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      if (seg && location.hostname.split('.')[0] + '.github.io' !== seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
